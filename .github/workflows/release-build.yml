name: Build and Upload Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Firmware
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Generate version.h
        run: |
          # Create version.h dynamically using the GitHub Release tag
          echo "#define FIRMWARE_VERSION \"${{ github.ref_name }}\"" > src/version.h
          echo "Created src/version.h with version ${{ github.ref_name }}"

      - name: Build All Environments
        run: pio run

      - name: Prepare Binaries and JSON Manifest
        run: |
          mkdir -p release_assets
          
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          
          # Initialize the base JSON structure under the new name
          jq -n --arg version "$TAG" '{version: $version, firmwares: []}' > release_assets/OTADirectory.json
          
          for env_dir in .pio/build/*/; do
            if [ -d "$env_dir" ]; then
              env_name=$(basename "$env_dir")
              
              if [ -f "$env_dir/firmware.bin" ]; then
                new_name="firmware_${env_name}.bin"
                filepath="release_assets/${new_name}"
                
                cp "$env_dir/firmware.bin" "$filepath"
                echo "Prepared ${new_name} for upload"
                
                md5_hash=$(md5sum "$filepath" | awk '{print $1}')
                file_url="${BASE_URL}/${new_name}"
                
                # Append this firmware's data into OTADirectory.json
                jq --arg name "$new_name" \
                   --arg url "$file_url" \
                   --arg md5 "$md5_hash" \
                   '.firmwares += [{"name": $name, "url": $url, "md5": $md5}]' \
                   release_assets/OTADirectory.json > release_assets/tmp.json && mv release_assets/tmp.json release_assets/OTADirectory.json
              fi
            fi
          done
          
          cat release_assets/OTADirectory.json

      - name: Commit and Push Manifest and Version to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          
          # Copy the newly named JSON out of the temporary folder
          cp release_assets/OTADirectory.json ./OTADirectory.json
          
          # Add, commit, and push OTADirectory.json AND version.h to the repo
          git add OTADirectory.json src/version.h
          git commit -m "Update OTA directory and version.h for release ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          # ONLY upload the .bin files to the actual GitHub Release
          files: Firmware/release_assets/*.bin